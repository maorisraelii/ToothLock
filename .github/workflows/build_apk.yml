name: Build Android APK & Publish Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Persistent Android Signing Keystore
        run: |
          if [ -f "toothlock-signing.keystore" ]; then
            mkdir -p ~/.android
            cp toothlock-signing.keystore ~/.android/debug.keystore
            echo "Loaded persistent toothlock-signing.keystore -> ~/.android/debug.keystore"
          else
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore toothlock-signing.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android -keypass android \
              -dname "CN=ToothLock Debug,O=ToothLock,C=IL"
            cp toothlock-signing.keystore ~/.android/debug.keystore
            git config user.name "ToothLock CI"
            git config user.email "ci@toothlock.app"
            git add toothlock-signing.keystore
            git commit -m "ci: Persist Android signing keystore so APK updates never require uninstall" || true
            git push origin HEAD:main || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Calculate App Version & Generate Release Notes
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          export VERSION_NAME="1.0.${RUN_NUM}"
          export VERSION_CODE=$((100 + RUN_NUM))
          export TAG_NAME="v${VERSION_NAME}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          python3 - << 'PYEOF'
          import os, subprocess
          ver = os.environ.get("VERSION_NAME", "1.0.1")
          code = os.environ.get("VERSION_CODE", "101")
          commit_msg = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], text=True).strip()

          md = f"""## 🪥 ToothLock v{ver} (Build {code})

          ### 🚀 מה חדש בגרסה זו:
          - **ווידג'ט מסך הבית:** סימון מהיר של צחצוח שיניים ישירות ממסך הבית (אדום/ירוק וספירת רצף).
          - **זיהוי שעון סמסונג:** בדיקה האם ה-Galaxy Watch מחובר לטלפון.
          - **זיהוי שינה (Bedtime / Sleep Mode):** התראה רוטטת חזקה שעוקפת מצב שינה ומעירה אותך בזמן.
          - **פעולות ישירות מהשעון:** כפתור "צחצחתי עכשיו!" ו"נודניק 10 דקות".

          ### 📝 פירוט עדכון:
          - `{commit_msg}`

          ---
          📦 **הורדה ישירה:** הורד את קובץ ה-APK המצורף (`ToothLock.apk`) והתקן ישירות בטלפון הגלקסי שלך (ניתן להתקין מעל גרסה קודמת).
          """
          with open("release_notes.md", "w", encoding="utf-8") as out:
              out.write("\n".join(line.lstrip() for line in md.strip().splitlines()) + "\n")
          PYEOF

      - name: Build Debug APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Clean Release File
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ToothLock.apk

      - name: Publish Direct GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "ToothLock ${{ env.TAG_NAME }}"
          body_path: release_notes.md
          files: ToothLock.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToothLock-APK
          path: ToothLock.apk
